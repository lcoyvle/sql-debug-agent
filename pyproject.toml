[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-debug-agent"
version = "0.1.0"
description = "A beginner-friendly, execution-guided SQL debugging agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["mlx-lm[train]==0.31.3"]

[project.scripts]
sql-debug-agent = "sql_debug_agent.cli:main"

[tool.setuptools.packages.find]
include = ["sql_debug_agent*"]
